# Render Blueprint — deploys BOTH services in one click:
#   1. aicte-approval-api      → Express REST API  (Node web service)
#   2. aicte-approval-portal   → React SPA          (static site, talks to the API above)
#
# Deploy: https://render.com/deploy?repo=https://github.com/prasanna01-hub/AICTE-APPROVAL-DASHBOARD
# Docs:   https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Backend — Express + TypeScript, bundled to dist/server.js
  # ---------------------------------------------------------------------------
  - type: web
    name: aicte-approval-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_URL
        value: https://aicte-approval-portal.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend — Vite build, API URL baked in from the backend service host above
  # ---------------------------------------------------------------------------
  - type: web
    name: aicte-approval-portal
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && VITE_API_BASE_URL="https://$AICTE_API_HOST/api" npm run build:web
    staticPublishPath: ./deploy/aicte-approval-portal
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: AICTE_API_HOST
        fromService:
          type: web
          name: aicte-approval-api
          property: host
